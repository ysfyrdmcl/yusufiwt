name: Apple Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.0.0)
        required: true
      build_number:
        description: Monotonic App Store/Sparkle build number
        required: true
      channel:
        description: macOS Sparkle channel
        required: true
        type: choice
        options: [beta, stable]
      platform:
        description: Artifacts to publish
        required: true
        type: choice
        options: [both, macos, ios]

permissions:
  contents: read

concurrency:
  group: apple-release-${{ inputs.version }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Verify release contracts
        run: make release-verify

  macos:
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install build tools
        run: brew install xcodegen
      - name: Import Developer ID certificate and protected keys
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          SPARKLE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          asc_key_path="$RUNNER_TEMP/AuthKey.p8"
          sparkle_key_path="$RUNNER_TEMP/sparkle-private-key"
          keychain_path="$RUNNER_TEMP/agentcontrol-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$asc_key_path"
          printf '%s' "$SPARKLE_KEY_BASE64" | base64 --decode > "$sparkle_key_path"
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          xcrun notarytool store-credentials agentcontrol-ci --key "$asc_key_path" \
            --key-id "${{ secrets.ASC_KEY_ID }}" --issuer "${{ secrets.ASC_ISSUER_ID }}"
          echo "SPARKLE_PRIVATE_KEY_FILE=$sparkle_key_path" >> "$GITHUB_ENV"
      - name: Build, notarize, and verify macOS artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AGENTCONTROL_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEYCHAIN_PROFILE: agentcontrol-ci
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: Scripts/release_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentControl-macOS-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.channel }}
          path: .build/releases/macos/
          if-no-files-found: error
          retention-days: 90

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install build tools
        run: brew install xcodegen
      - name: Import Apple Distribution certificate and API key
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          asc_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/agentcontrol-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$asc_key_path"
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CI_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "ASC_KEY_PATH=$asc_key_path" >> "$GITHUB_ENV"
      - name: Archive and upload TestFlight build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          AGENTCONTROL_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: Scripts/release_ios.sh upload
      - uses: actions/upload-artifact@v4
        with:
          name: AgentControl-iOS-${{ inputs.version }}-${{ inputs.build_number }}
          path: .build/releases/ios/
          if-no-files-found: error
          retention-days: 90
