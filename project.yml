name: yusufiwt
options:
  bundleIdPrefix: com.yusuf.agentcontrol
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  MacLocalRelease: release
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  MacLocalRelease: Config/MacLocalRelease.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  AgentControlKit:
    path: Packages/AgentControlKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
targets:
  AgentControlMacLocal:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
        excludes:
          - SparkleUpdateController.swift
          - Info.plist
      - path: Apps/Shared
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Apps/macOS/Info-MacLocal.plist
      properties:
        CFBundleDisplayName: yusufiwt
        CFBundleName: yusufiwt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.yusuf.agentcontrol.navigation
            CFBundleURLSchemes:
              - agentcontrol
              - yusufiwt
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: yusufiwt uses Automation only when you explicitly ask it to reveal an exact pane in a supported terminal.
        AgentControlReleaseScope: mac-local-v1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAC_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: yusufiwt
    entitlements:
      path: Config/Entitlements/AgentControlMac.entitlements
    dependencies:
      - target: AgentControlHelper
        embed: false
      - target: AgentControlHook
        embed: false
      - package: AgentControlKit
        product: AgentLocalIPC
      - package: AgentControlKit
        product: AgentMacUI
    postBuildScripts:
      - name: Embed Mac Local Helper and Hook
        script: |
          set -eu
          helper_destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/AgentControlHelper"
          hook_destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/agentcontrol-hook"
          plist_directory="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$plist_directory"
          cp "$BUILT_PRODUCTS_DIR/AgentControlHelper" "$helper_destination"
          cp "$BUILT_PRODUCTS_DIR/agentcontrol-hook" "$hook_destination"
          cp "$SRCROOT/Config/LaunchAgents/com.yusuf.agentcontrol.helper.plist" "$plist_directory/com.yusuf.agentcontrol.helper.plist"
          chmod 755 "$helper_destination" "$hook_destination"
          chmod 644 "$plist_directory/com.yusuf.agentcontrol.helper.plist"
          resources_directory="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          manifest="$resources_directory/release-manifest.json"
          mkdir -p "$resources_directory"
          helper_sha=$(/usr/bin/shasum -a 256 "$helper_destination" | /usr/bin/cut -d ' ' -f 1)
          hook_sha=$(/usr/bin/shasum -a 256 "$hook_destination" | /usr/bin/cut -d ' ' -f 1)
          /usr/bin/printf '{"schemaVersion":1,"releaseScope":"mac-local-v1","marketingVersion":"%s","buildNumber":%s,"localProtocolVersion":1,"helper":{"path":"Contents/MacOS/AgentControlHelper","sha256":"%s"},"hook":{"path":"Contents/MacOS/agentcontrol-hook","sha256":"%s"}}\n' "$MARKETING_VERSION" "$CURRENT_PROJECT_VERSION" "$helper_sha" "$hook_sha" > "$manifest"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/AgentControlHelper
          - $(BUILT_PRODUCTS_DIR)/agentcontrol-hook
          - $(SRCROOT)/Config/LaunchAgents/com.yusuf.agentcontrol.helper.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/AgentControlHelper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/agentcontrol-hook
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.yusuf.agentcontrol.helper.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/release-manifest.json
  AgentControlMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
        excludes:
          - Info-MacLocal.plist
      - path: Apps/Shared
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: yusufiwt
        CFBundleName: yusufiwt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.yusuf.agentcontrol.navigation
            CFBundleURLSchemes:
              - agentcontrol
              - yusufiwt
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: yusufiwt uses Automation only when you explicitly ask it to reveal an exact pane in a supported terminal.
        SUEnableAutomaticChecks: false
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUVerifyUpdateBeforeExtraction: true
        AgentControlUpdateChannel: $(SPARKLE_CHANNEL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAC_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: yusufiwt
    entitlements:
      path: Config/Entitlements/AgentControlMac.entitlements
    dependencies:
      - target: AgentControlHelper
      - target: AgentControlHook
      - package: AgentControlKit
        product: AgentLocalIPC
      - package: AgentControlKit
        product: AgentCompanion
      - package: AgentControlKit
        product: AgentMacUI
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Embed LaunchAgent Helper
        script: |
          set -eu
          helper_destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/AgentControlHelper"
          hook_destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/agentcontrol-hook"
          plist_directory="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$plist_directory"
          cp "$BUILT_PRODUCTS_DIR/AgentControlHelper" "$helper_destination"
          cp "$BUILT_PRODUCTS_DIR/agentcontrol-hook" "$hook_destination"
          cp "$SRCROOT/Config/LaunchAgents/com.yusuf.agentcontrol.helper.plist" "$plist_directory/com.yusuf.agentcontrol.helper.plist"
          chmod 755 "$helper_destination"
          chmod 755 "$hook_destination"
          chmod 644 "$plist_directory/com.yusuf.agentcontrol.helper.plist"
          case "$CURRENT_PROJECT_VERSION" in
            ''|*[!0-9]*) echo 'CURRENT_PROJECT_VERSION must be a positive integer' >&2; exit 1 ;;
          esac
          resources_directory="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          manifest="$resources_directory/release-manifest.json"
          mkdir -p "$resources_directory"
          helper_sha=$(/usr/bin/shasum -a 256 "$helper_destination" | /usr/bin/cut -d ' ' -f 1)
          hook_sha=$(/usr/bin/shasum -a 256 "$hook_destination" | /usr/bin/cut -d ' ' -f 1)
          /usr/bin/printf '{"schemaVersion":1,"marketingVersion":"%s","buildNumber":%s,"localProtocolVersion":1,"helper":{"path":"Contents/MacOS/AgentControlHelper","sha256":"%s"},"hook":{"path":"Contents/MacOS/agentcontrol-hook","sha256":"%s"}}\n' "$MARKETING_VERSION" "$CURRENT_PROJECT_VERSION" "$helper_sha" "$hook_sha" > "$manifest"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/AgentControlHelper
          - $(BUILT_PRODUCTS_DIR)/agentcontrol-hook
          - $(SRCROOT)/Config/LaunchAgents/com.yusuf.agentcontrol.helper.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/AgentControlHelper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/agentcontrol-hook
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.yusuf.agentcontrol.helper.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/release-manifest.json
  AgentControliOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/Shared
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: yusufiwt
        CFBundleName: yusufiwt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.yusuf.agentcontrol.companion
            CFBundleURLSchemes:
              - agentcontrol
              - yusufiwt
        NSCameraUsageDescription: Scan the pairing QR code shown by yusufiwt on your Mac.
        NSFaceIDUsageDescription: Confirm high-risk agent decisions before sending them to your Mac.
        AgentControlAppGroup: $(APP_GROUP_ID)
        AgentControlKeychainGroup: $(KEYCHAIN_ACCESS_GROUP)
        AgentControlRelayBaseURL: $(RELAY_BASE_URL)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: yusufiwt
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Config/Entitlements/AgentControliOS.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP)
    dependencies:
      - target: NotificationService
      - target: AgentLiveActivity
      - target: AgentWidgets
      - target: AgentControlWatch
      - package: AgentControlKit
        product: AgentDomain
      - package: AgentControlKit
        product: AgentCompanion
  AgentControlWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS
      - Apps/Shared
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: yusufiwtWatch
        INFOPLIST_KEY_CFBundleDisplayName: yusufiwt
        INFOPLIST_KEY_CFBundleName: yusufiwt
        SKIP_INSTALL: YES
    entitlements:
      path: Config/Entitlements/AgentControlWatch.entitlements
    dependencies:
      - package: AgentControlKit
        product: AgentDomain
      - package: AgentControlKit
        product: AgentCompanion
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Apps/Extensions/NotificationService
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOTIFICATION_SERVICE_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.usernotifications.service
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Config/Entitlements/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP)
    dependencies:
      - package: AgentControlKit
        product: AgentCompanion
  AgentLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Apps/Extensions/AgentLiveActivity
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIVE_ACTIVITY_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Entitlements/LiveActivity.entitlements
    dependencies:
      - package: AgentControlKit
        product: AgentDomain
      - package: AgentControlKit
        product: AgentCompanion
  AgentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Apps/Extensions/AgentWidgets
      - Apps/Shared
      - path: Config/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGETS_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_AgentControlAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Config/Entitlements/AgentWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - package: AgentControlKit
        product: AgentCompanion
  AgentControlHelper:
    type: tool
    platform: macOS
    sources:
      - Services/AgentControlHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HELPER_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: AgentControlHelper
        SKIP_INSTALL: YES
    dependencies:
      - package: AgentControlKit
        product: AgentLocalIPC
    entitlements:
      path: Config/Entitlements/AgentControlHelper.entitlements
  AgentControlHook:
    type: tool
    platform: macOS
    sources:
      - Tools/AgentControlHook
    settings:
      base:
        PRODUCT_NAME: agentcontrol-hook
        SKIP_INSTALL: YES
    dependencies:
      - package: AgentControlKit
        product: AgentHookKit
      - package: AgentControlKit
        product: AgentLocalIPC
      - package: AgentControlKit
        product: AgentProtocol
  FakeAgentSimulator:
    type: tool
    platform: macOS
    sources:
      - Tools/FakeAgentSimulator
    settings:
      base:
        PRODUCT_NAME: fake-agent-simulator
    dependencies:
      - package: AgentControlKit
        product: AgentHookKit
      - package: AgentControlKit
        product: AgentLocalIPC
  ProtocolInspector:
    type: tool
    platform: macOS
    sources:
      - Tools/ProtocolInspector
    settings:
      base:
        PRODUCT_NAME: protocol-inspector
    dependencies:
      - package: AgentControlKit
        product: AgentHookKit
      - package: AgentControlKit
        product: AgentLocalIPC
schemes:
  AgentControlMacLocal:
    build:
      targets:
        AgentControlMacLocal: all
    run:
      config: MacLocalRelease
    archive:
      config: MacLocalRelease
  AgentControlMac:
    build:
      targets:
        AgentControlMac: all
  AgentControliOS:
    build:
      targets:
        AgentControliOS: all
  AgentControlWatch:
    build:
      targets:
        AgentControlWatch: all
